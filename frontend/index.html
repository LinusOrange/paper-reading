<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SAR Demo · Dashboard</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="brand">
          <h1>SAR Demo</h1>
          <p>机载高分辨率 SAR 成像文献系统</p>
        </div>
        <nav>
          <a href="/index.html" data-nav="dashboard">总览</a>
          <a href="/papers.html" data-nav="papers">论文库</a>
          <a href="/imports.html" data-nav="imports">文献导入</a>
          <a href="/analysis.html" data-nav="analysis">分析与问答</a>
          <a href="/literature.html" data-nav="literature">Codex文献检索</a>
        </nav>
      </aside>
      <main class="content">
        <header class="page-header">
          <div>
            <div class="eyebrow">Overview</div>
            <h2>更轻盈的文献工作台</h2>
            <p>查看系统概览、最近论文和任务流转情况。</p>
          </div>
          <div class="status-pill" id="health-status">正在检查服务…</div>
        </header>
        <section class="panel split-search dashboard-highlight">
          <div class="hero-card">
            <div class="eyebrow">Workspace</div>
            <h3>围绕论文导入、分析与预览的统一入口</h3>
            <p class="muted-text">现在可以直接从论文库页面预览 PDF，也能在分析页更清晰地查看哪个任务在排队、哪个任务正在处理。</p>
          </div>
          <div>
            <div class="panel-header">
              <h3>系统总览</h3>
              <button id="refresh-button">刷新数据</button>
            </div>
            <div class="cards" id="stats-cards"></div>
          </div>
        </section>
        <section class="panel split-search">
          <div>
            <div class="panel-header"><h3>最近论文</h3></div>
            <div id="recent-papers" class="list"></div>
          </div>
          <div>
            <div class="panel-header"><h3>最新任务动态</h3></div>
            <div id="queue-highlights" class="list compact"></div>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/dashboard.js"></script>
  </body>
</html>
