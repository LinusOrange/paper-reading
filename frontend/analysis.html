<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SAR Demo · Analysis</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="brand"><h1>SAR Demo</h1><p>机载高分辨率 SAR 成像文献系统</p></div>
        <nav>
          <a href="/index.html" data-nav="dashboard">总览</a>
          <a href="/papers.html" data-nav="papers">论文库</a>
          <a href="/imports.html" data-nav="imports">文献导入</a>
          <a href="/analysis.html" data-nav="analysis">分析与问答</a>
          <a href="/literature.html" data-nav="literature">Codex文献检索</a>
        </nav>
      </aside>
      <main class="content">
        <header class="page-header">
          <div>
            <div class="eyebrow">Analysis</div>
            <h2>任务队列与问答</h2>
            <p>一眼看清当前活跃任务、排队状态和最近问答结果。</p>
          </div>
          <div class="status-pill" id="health-status">正在检查服务…</div>
        </header>
        <section class="panel hero-grid">
          <div id="active-task"></div>
          <div id="task-summary" class="mini-stat-grid"></div>
        </section>
        <section class="panel split-search">
          <div>
            <div class="panel-header"><h3>OpenAI 分析任务入口</h3></div>
            <form id="analysis-form" class="search-form">
              <label>搜索论文标题
                <input id="analysis-paper-search" name="paper_search" type="text" placeholder="输入关键词筛选论文标题" />
              </label>
              <label>选择论文标题
                <select id="analysis-paper-select" name="paper_id"></select>
              </label>
              <label>任务列表（可多选）
                <select id="analysis-task-types" name="task_types" multiple size="4">
                  <option value="extract_text">extract_text</option>
                  <option value="generate_summary" selected>generate_summary</option>
                  <option value="extract_entities" selected>extract_entities</option>
                  <option value="recommend_tags" selected>recommend_tags</option>
                  <option value="build_embeddings">build_embeddings</option>
                </select>
              </label>
              <button type="submit">创建 OpenAI 分析任务</button>
            </form>
          </div>
          <div>
            <div class="panel-header"><h3>任务创建结果</h3></div>
            <div id="analysis-response" class="detail empty-state">这里展示刚刚加入队列的任务信息。</div>
          </div>
        </section>
        <section class="panel split-search">
          <div>
            <div class="panel-header"><h3>问答</h3></div>
            <form id="qa-form" class="search-form">
              <label>问题<textarea name="question" rows="4">大斜视场景下哪些方法适合高分辨成像？</textarea></label>
              <button type="submit">发送问答</button>
            </form>
            <div id="qa-answer" class="detail empty-state">这里展示问答结果。</div>
          </div>
          <div>
            <div class="panel-header"><h3>最近任务</h3><span class="muted-text">每 10 秒自动刷新</span></div>
            <div id="task-list" class="list compact"></div>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/analysis-page.js"></script>
  </body>
</html>
