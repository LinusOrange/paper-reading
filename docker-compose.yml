version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sar-demo-postgres
    environment:
      POSTGRES_DB: sar_demo
      POSTGRES_USER: sar_demo
      POSTGRES_PASSWORD: sar_demo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sar-demo-backend
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql+psycopg://sar_demo:sar_demo@postgres:5432/sar_demo
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: sar-demo-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
