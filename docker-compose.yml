version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sar-demo-postgres
    environment:
      POSTGRES_DB: sar_demo
      POSTGRES_USER: sar_demo
      POSTGRES_PASSWORD: sar_demo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sar-demo-backend
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql+psycopg://sar_demo:sar_demo@postgres:5432/sar_demo
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      UPLOAD_DIR: /app/data/uploads
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/data/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: sar-demo-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  postgres_data:
  uploads_data:
